<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Email Tracker</title>

    <link rel="stylesheet" href="popup.css" />
  </head>

  <body>
    <main class="container">
      <header class="header">
        <div class="brand">
          <div class="brand-icon">E</div>
          <div>
            <h1>Email Tracker</h1>
            <p>Your email activity</p>
          </div>
        </div>

        <button id="refresh-button" class="icon-button" title="Refresh">
          ↻
        </button>
      </header>

      <section id="login-section">
        <h2>Welcome back</h2>
        <p class="description">Sign in to your account.</p>

        <form id="login-form">
          <label for="email">Email address</label>
          <input id="email" type="email" required />

          <label for="password">Password</label>
          <input id="password" type="password" required />

          <button id="login-button" type="submit">Sign in</button>
        </form>
      </section>

      <section id="dashboard-section" hidden>
        <div class="account-row">
          <div>
            <span class="online-dot"></span>
            <span id="user-email">Connected</span>
          </div>

          <button id="logout-button" class="text-button">Sign out</button>
        </div>

        <div class="stats-grid">
          <article class="stat-card">
            <span>Tracked emails</span>
            <strong id="total-tracked">0</strong>
          </article>

          <article class="stat-card">
            <span>Emails opened</span>
            <strong id="opened-emails">0</strong>
          </article>

          <article class="stat-card">
            <span>Total opens</span>
            <strong id="total-opens">0</strong>
          </article>
        </div>

        <section class="activity-section">
          <div class="section-header">
            <h2>Tracked emails</h2>
            <span>Latest 20</span>
          </div>
          <div id="email-list" class="activity-list"></div>
        </section>
      </section>

      <p id="status-message" role="status"></p>

      <footer>
        <span>EMAIL TRACKER</span>
        <span>v1.0.0</span>
      </footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
